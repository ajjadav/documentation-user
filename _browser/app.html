<title>Odoo 12 Docs Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root {
  --bg: #f3f6f5;
  --surface: #ffffff;
  --surface-2: #e9efed;
  --ink: #15201c;
  --ink-2: #3f4d48;
  --muted: #66746f;
  --line: #d6dfdb;
  --accent: #0d6a5c;
  --accent-hover: #0a5549;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe9;
  --mark: #ffe48a;
  --code-bg: #eef3f1;
  --note-bg: #e6f0fa; --note-fg: #1d5790;
  --tip-bg: #e5f3e8; --tip-fg: #1f6a36;
  --warn-bg: #fcf0db; --warn-fg: #845500;
  --danger-bg: #fae5e3; --danger-fg: #9d2b22;
  --shadow: 0 12px 32px rgba(21, 32, 28, .14), 0 2px 6px rgba(21, 32, 28, .08);
  --topbar-h: 60px;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1412;
    --surface: #151c1a;
    --surface-2: #1c2523;
    --ink: #e3ebe7;
    --ink-2: #b4c1bb;
    --muted: #8b9994;
    --line: #29332f;
    --accent: #5cc6b1;
    --accent-hover: #7dd5c3;
    --accent-ink: #06231d;
    --accent-soft: #163632;
    --mark: #6a5813;
    --code-bg: #1a2321;
    --note-bg: #14263a; --note-fg: #93c2f2;
    --tip-bg: #142d1d; --tip-fg: #8dd4a1;
    --warn-bg: #33270e; --warn-fg: #efc26a;
    --danger-bg: #381a17; --danger-fg: #f2a096;
    --shadow: 0 12px 32px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1412;
  --surface: #151c1a;
  --surface-2: #1c2523;
  --ink: #e3ebe7;
  --ink-2: #b4c1bb;
  --muted: #8b9994;
  --line: #29332f;
  --accent: #5cc6b1;
  --accent-hover: #7dd5c3;
  --accent-ink: #06231d;
  --accent-soft: #163632;
  --mark: #6a5813;
  --code-bg: #1a2321;
  --note-bg: #14263a; --note-fg: #93c2f2;
  --tip-bg: #142d1d; --tip-fg: #8dd4a1;
  --warn-bg: #33270e; --warn-fg: #efc26a;
  --danger-bg: #381a17; --danger-fg: #f2a096;
  --shadow: 0 12px 32px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .35);
}

* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--topbar-h) + 16px); }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.6 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-underline-offset: 2px; text-decoration-thickness: 1px; }
a:hover { color: var(--accent-hover); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; }
kbd {
  font: 500 .78em var(--font-mono);
  padding: 1px 6px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 5px;
  background: var(--surface);
  color: var(--ink-2);
}

/* ---------- shell ---------- */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 12px;
  height: var(--topbar-h);
  padding-inline: 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.icon-btn {
  display: none;
  flex: none;
  width: 40px; height: 40px;
  align-items: center; justify-content: center;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  cursor: pointer;
}
.icon-btn svg { width: 20px; height: 20px; }
.brand {
  display: flex; align-items: center; gap: 10px;
  flex: none;
  width: 258px;
  color: var(--ink);
  text-decoration: none;
}
.brand:hover { color: var(--ink); }
.brand-mark {
  display: grid; place-items: center;
  width: 32px; height: 32px;
  border-radius: 9px;
  background: var(--accent);
  color: var(--accent-ink);
  font: 700 15px/1 var(--font-display);
  letter-spacing: -.02em;
}
.brand-name { font: 700 18px/1.1 var(--font-display); letter-spacing: -.01em; }
.brand-name small { display: block; font: 500 11px/1.3 var(--font-body); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }

.search { position: relative; flex: 1 1 auto; max-width: 640px; min-width: 0; }
.search-field {
  display: flex; align-items: center; gap: 8px;
  height: 40px;
  padding-inline: 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
}
.search-field:focus-within { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
.search-field svg { flex: none; width: 18px; height: 18px; color: var(--muted); }
.search-field input {
  flex: 1; min-width: 0;
  height: 100%;
  border: 0; outline: 0;
  background: transparent;
  color: var(--ink);
  font: 400 15px var(--font-body);
}
.search-field input::placeholder { color: var(--muted); }
.search-field input::-webkit-search-cancel-button { display: none; }
.search-clear { border: 0; background: none; padding: 4px; cursor: pointer; color: var(--muted); display: flex; }
.search-clear svg { width: 16px; height: 16px; }
.topbar-link { margin-left: auto; flex: none; font-size: 14px; font-weight: 500; color: var(--ink-2); text-decoration: none; }
.topbar-link:hover { color: var(--accent); }

.results {
  position: absolute;
  top: calc(100% + 8px);
  left: 0; right: 0;
  max-height: min(70vh, 640px);
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow);
}
.results-head {
  position: sticky; top: 0;
  padding: 10px 16px;
  font-size: 13px; color: var(--muted);
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.results-head b { color: var(--ink); font-weight: 600; }
.result { padding: 4px 8px; border-bottom: 1px solid var(--line); }
.result:last-child { border-bottom: 0; }
.result-main {
  display: grid; gap: 2px;
  padding: 8px 8px;
  border-radius: 8px;
  color: var(--ink);
  text-decoration: none;
}
.result-main:hover, .result-main.is-active { background: var(--accent-soft); color: var(--ink); }
.result-path { font-size: 12px; color: var(--muted); }
.result-title { font-weight: 600; font-size: 15px; line-height: 1.35; }
.result-snip { font-size: 13.5px; line-height: 1.5; color: var(--ink-2); }
.result mark, .doc mark.hit { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.result-heads { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 8px 8px; }
.result-heads a {
  font-size: 12.5px;
  padding: 2px 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--ink-2);
  text-decoration: none;
}
.result-heads a:hover { border-color: var(--accent); color: var(--accent); }
.results-empty { padding: 20px 16px; color: var(--ink-2); font-size: 14px; }

.layout {
  display: grid;
  grid-template-columns: 290px minmax(0, 1fr);
  min-height: calc(100vh - var(--topbar-h));
}
.sidebar {
  position: sticky;
  top: calc(var(--topbar-h) + env(safe-area-inset-top, 0px));
  height: calc(100vh - var(--topbar-h) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 20px 12px 40px 16px;
  border-right: 1px solid var(--line);
  background: var(--bg);
  font-size: 14px;
}
.nav-home {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px;
  margin-bottom: 12px;
  border-radius: 8px;
  color: var(--ink);
  font-weight: 500;
  text-decoration: none;
}
.nav-home:hover { background: var(--surface-2); color: var(--ink); }
.nav-home[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav-group + .nav-group { margin-top: 18px; }
.nav-group-title {
  display: block;
  padding: 4px 8px;
  font-size: 11.5px; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted);
  text-decoration: none;
}
.nav-group-title:hover, .nav-group-title[aria-current="page"] { color: var(--accent); }
.nav ul { list-style: none; margin: 0; padding: 0; }
.nav ul ul { margin-left: 15px; padding-left: 6px; border-left: 1px solid var(--line); display: none; }
.nav li.open > ul { display: block; }
.nav-row { display: flex; align-items: flex-start; }
.twisty {
  flex: none;
  width: 22px; height: 30px;
  display: grid; place-items: center;
  border: 0; background: none; cursor: pointer;
  color: var(--muted);
  border-radius: 6px;
}
.twisty svg { width: 12px; height: 12px; transition: transform .15s; }
li.open > .nav-row > .twisty svg { transform: rotate(90deg); }
.twisty:hover { color: var(--ink); }
.twisty-spacer { flex: none; width: 22px; }
.nav-link {
  flex: 1; min-width: 0;
  padding: 5px 8px;
  border-radius: 7px;
  line-height: 1.35;
  color: var(--ink-2);
  text-decoration: none;
}
.nav-link:hover { background: var(--surface-2); color: var(--ink); }
.nav-link[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav > .nav-group > ul > li > .nav-row > .nav-link { color: var(--ink); font-weight: 500; }
.nav > .nav-group > ul > li > .nav-row > .nav-link[aria-current="page"] { color: var(--accent); font-weight: 600; }

.backdrop { position: fixed; inset: 0; z-index: 39; background: rgba(8, 14, 12, .45); }

.main { min-width: 0; padding: 32px 40px 80px; }

/* ---------- home ---------- */
.home { max-width: 1080px; margin: 0 auto; display: grid; gap: 44px; }
.home-head { display: grid; gap: 14px; padding-top: 8px; }
.eyebrow { margin: 0; font-size: 12.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.home-title {
  margin: 0;
  max-width: 22ch;
  font: 700 clamp(2rem, 4.6vw, 3.1rem)/1.04 var(--font-display);
  letter-spacing: -.025em;
  text-wrap: balance;
}
.home-lede { margin: 0; max-width: 60ch; font-size: 17px; color: var(--ink-2); }
.try { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.chip {
  padding: 5px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink-2);
  font-size: 14px;
  cursor: pointer;
  text-decoration: none;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.home-section { display: grid; gap: 16px; }
.home-h { margin: 0; display: flex; align-items: baseline; gap: 10px; font: 700 1.35rem/1.2 var(--font-display); letter-spacing: -.01em; }
.home-h span { font: 400 14px var(--font-body); color: var(--muted); }
.app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.app-card {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr);
  grid-template-rows: auto auto 1fr;
  column-gap: 12px;
  row-gap: 2px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--ink);
  text-decoration: none;
  transition: border-color .15s, transform .15s;
}
.app-card:hover { border-color: var(--accent); color: var(--ink); transform: translateY(-1px); }
.app-icon {
  grid-row: 1 / 4;
  display: grid; place-items: center;
  width: 44px; height: 44px;
  border-radius: 11px;
  background: var(--accent-soft);
  color: var(--accent);
  font: 700 17px/1 var(--font-display);
  letter-spacing: -.02em;
}
.app-title { font-weight: 600; line-height: 1.3; }
.app-count { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.app-sub { margin-top: 6px; font-size: 13px; line-height: 1.45; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0 28px; }
.list-link {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding: 11px 2px;
  border-bottom: 1px solid var(--line);
  color: var(--ink);
  text-decoration: none;
}
.list-link span { font-size: 12.5px; color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
.list-link:hover { color: var(--accent); }
.recent { display: flex; flex-wrap: wrap; gap: 8px; }
.home-foot { padding-top: 20px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.home-foot p { margin: 0 0 4px; }

/* ---------- page ---------- */
.page { display: grid; grid-template-columns: minmax(0, 46rem) 13.5rem; gap: 56px; max-width: 1120px; margin: 0 auto; }
.page-main { min-width: 0; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 13.5px; color: var(--muted); }
.crumbs a { color: var(--ink-2); text-decoration: none; }
.crumbs a:hover { color: var(--accent); text-decoration: underline; }
.page-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 6px; font-size: 13px; color: var(--muted); }
.page-meta a { color: var(--muted); }
.page-meta a:hover { color: var(--accent); }
.toc-rail { position: sticky; top: calc(var(--topbar-h) + 32px); align-self: start; max-height: calc(100vh - var(--topbar-h) - 64px); overflow-y: auto; font-size: 13.5px; }
.toc-label { margin: 0 0 8px; font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.toc-list { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--line); }
.toc-list a { display: block; margin-left: -1px; padding: 4px 0 4px 12px; border-left: 2px solid transparent; color: var(--ink-2); text-decoration: none; line-height: 1.4; }
.toc-list .lvl-3 a { padding-left: 24px; font-size: 13px; }
.toc-list a:hover { color: var(--ink); }
.toc-list a.is-active { border-left-color: var(--accent); color: var(--accent); font-weight: 500; }
.toc-inline { display: none; margin-top: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.toc-inline summary { padding: 10px 14px; cursor: pointer; font-size: 14px; font-weight: 600; }
.toc-inline .toc-list { margin: 0 14px 12px; }

.hitbar {
  position: sticky; top: calc(var(--topbar-h) + env(safe-area-inset-top, 0px) + 8px); z-index: 5;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  margin-top: 16px;
  padding: 8px 8px 8px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  box-shadow: var(--shadow);
  font-size: 13.5px;
}
.hitbar-text { flex: 1; min-width: 12ch; }
.hitbar button { padding: 4px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); cursor: pointer; font-size: 13px; }
.hitbar button:hover { border-color: var(--accent); color: var(--accent); }
.doc mark.hit.is-current { outline: 2px solid var(--accent); outline-offset: 1px; }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 56px; }
.pager a {
  display: grid; gap: 2px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--ink);
  text-decoration: none;
}
.pager a:hover { border-color: var(--accent); }
.pager .next { text-align: right; grid-column: 2; }
.pager small { font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.pager span { font-weight: 600; line-height: 1.35; }

/* ---------- document content ---------- */
.doc { margin-top: 20px; font-size: 16.5px; line-height: 1.68; overflow-wrap: break-word; }
.doc section { scroll-margin-top: calc(var(--topbar-h) + 20px); }
.doc h1, .doc h2, .doc h3, .doc h4, .doc h5 { color: var(--ink); text-wrap: balance; scroll-margin-top: calc(var(--topbar-h) + 20px); }
.doc h1 { margin: 0 0 20px; font: 700 clamp(1.85rem, 3.4vw, 2.45rem)/1.1 var(--font-display); letter-spacing: -.02em; }
.doc h2 { margin: 2.2em 0 .6em; padding-top: .9em; border-top: 1px solid var(--line); font: 700 1.5rem/1.2 var(--font-display); letter-spacing: -.01em; }
.doc h3 { margin: 1.8em 0 .5em; font: 600 1.2rem/1.3 var(--font-body); }
.doc h4, .doc h5 { margin: 1.5em 0 .4em; font: 600 1.02rem/1.35 var(--font-body); }
.doc p { margin: 0 0 1em; }
.doc ul, .doc ol { margin: 0 0 1em; padding-left: 1.4em; }
.doc li { margin: .25em 0; }
.doc li > p { margin: 0 0 .4em; }
.doc dl { margin: 0 0 1em; }
.doc dt { font-weight: 600; }
.doc dd { margin: 0 0 .8em 1.2em; }
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
.doc blockquote { margin: 0 0 1em; padding-left: 16px; border-left: 3px solid var(--line); color: var(--ink-2); }
.doc code, .doc tt, .doc kbd, .doc samp {
  font-family: var(--font-mono);
  font-size: .86em;
}
.doc code.literal, .doc :not(pre) > code {
  padding: .1em .38em;
  border-radius: 5px;
  background: var(--code-bg);
  border: 1px solid var(--line);
}
.doc pre {
  margin: 0 0 1.2em;
  padding: 14px 16px;
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--code-bg);
  font: 400 13.5px/1.6 var(--font-mono);
  -webkit-overflow-scrolling: touch;
}
.doc .highlight .k, .doc .highlight .kn, .doc .highlight .kc, .doc .highlight .nt { color: var(--accent); font-weight: 500; }
.doc .highlight .s, .doc .highlight .s1, .doc .highlight .s2, .doc .highlight .sd { color: var(--tip-fg); }
.doc .highlight .c, .doc .highlight .c1, .doc .highlight .cm, .doc .highlight .go { color: var(--muted); }
.doc .highlight .gp { color: var(--muted); user-select: none; }
.doc .highlight .m, .doc .highlight .mi, .doc .highlight .mf { color: var(--warn-fg); }
.doc .highlight .nb, .doc .highlight .bp, .doc .highlight .nv { color: var(--note-fg); }

.doc .table-wrap { margin: 0 0 1.4em; overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; -webkit-overflow-scrolling: touch; }
.doc table { width: 100%; border-collapse: collapse; font-size: 14.5px; line-height: 1.5; }
.doc th, .doc td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.doc th + th, .doc td + td, .doc td + th, .doc th + td { border-left: 1px solid var(--line); }
.doc tr:last-child > td, .doc tr:last-child > th { border-bottom: 0; }
.doc thead th, .doc th.head { background: var(--surface-2); font-weight: 600; }
.doc th.stub { background: var(--bg); }
.doc td p:last-child, .doc th p:last-child { margin-bottom: 0; }
.doc .text-right { text-align: right; font-variant-numeric: tabular-nums; }

.doc img { max-width: 100%; height: auto; vertical-align: middle; }
.doc img.align-center, .doc section > img, .doc section > a > img, .doc li > img, .doc dd > img,
.doc .admonition > img, .doc figure img, .doc blockquote > div > img, .doc td > img {
  display: block;
  margin: 18px 0 22px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
}
.doc img.align-center { margin-inline: auto; }
.doc td > img { margin: 4px 0; }
.doc img[src] { cursor: zoom-in; }
.doc p img, .doc a.reference img[alt^="View"], .doc a.reference img[alt^="Download"] { cursor: default; }
.doc img.is-loading { background: var(--surface-2); }
.doc img.is-missing { min-height: 48px; padding: 12px; border: 1px dashed var(--line); color: var(--muted); font-size: 13px; }
.doc figure { margin: 0 0 1.2em; }
.doc figcaption { font-size: 13.5px; color: var(--muted); text-align: center; }

.doc .admonition {
  margin: 0 0 1.3em;
  padding: 14px 18px;
  border-radius: 10px;

    var shots = META.screenshots ? ', ' + META.screenshots.toLocaleString('en-US') + ' screenshots' : '';
    var html = '<div class="home">' +
      '<header class="home-head">' +
      '<p class="eyebrow">Odoo ' + esc(META.version) + ' · User documentation</p>' +
      '<h1 class="home-title">Every Odoo app, documented and searchable.</h1>' +
      '<p class="home-lede">All ' + pageCount + ' pages of the Odoo ' + esc(META.version) + ' user documentation' + shots +
      ', organised by app. Search matches page titles, section headings and full text. Press <kbd>/</kbd> to start typing.</p>' +
      '<div class="try"><span>Try</span>' + ['bank reconciliation', 'landed costs', 'lots and serial numbers', 'payment terms', 'loyalty program', 'odoo.sh'].map(function (s) {
        return '<button class="chip" type="button" data-q="' + esc(s) + '">' + esc(s) + '</button>';
      }).join('') + '</div></header>';
    if (recent.length) {
      html += '<section class="home-section"><h2 class="home-h">Recently read</h2><div class="recent">' +
        recent.map(function (id) { return '<a class="chip" href="#' + esc(id) + '">' + esc(title(id)) + '</a>'; }).join('') +
        '</div></section>';
    }
    html += '<section class="home-section"><h2 class="home-h">' + esc(title('applications')) + ' <span>' + apps.length + ' apps</span></h2><div class="app-grid">' +
      apps.map(function (id) {
        var subs = (children[id] || []).map(title);
        var n = descCount(id) + 1;
        return '<a class="app-card" href="#' + esc(id) + '"><span class="app-icon" aria-hidden="true">' + esc(monogram(title(id))) + '</span>' +
          '<span class="app-title">' + esc(title(id)) + '</span>' +
          '<span class="app-count">' + n + (n === 1 ? ' page' : ' pages') + '</span>' +
          (subs.length ? '<span class="app-sub">' + esc(subs.slice(0, 4).join(' · ')) + (subs.length > 4 ? ' · …' : '') + '</span>' : '') +
          '</a>';
      }).join('') + '</div></section>';
    NAV.forEach(function (it) {
      var id = it[0];
      if (id === 'applications') return;
      var ids = children[id].length ? children[id] : linkedPages(id);
      if (!ids.length) return;
      html += '<section class="home-section"><h2 class="home-h">' + esc(title(id)) + '</h2><div class="list-grid">' +
        ids.map(function (c) {
          var n = descCount(c);
          return '<a class="list-link" href="#' + esc(c) + '">' + esc(title(c)) + (n ? '<span>' + (n + 1) + ' pages</span>' : '') + '</a>';
        }).join('') + '</div></section>';
    });
    html += '<footer class="home-foot"><p>An unofficial reader built from <a href="' + esc(REPO_URL) + '" target="_blank" rel="noopener noreferrer">' +
      esc(META.repo) + '</a>, branch ' + esc(META.branch) + ' at commit ' + esc(META.commit) + ', on ' + esc(META.built) + '.</p>' +
      '<p>Documentation content © Odoo S.A. Rebuild it with <code>python3 _browser/build.py</code>.</p></footer></div>';
    view.innerHTML = html;
    $$('[data-q]', view).forEach(function (b) {
      b.addEventListener('click', function () { q.value = b.getAttribute('data-q'); renderResults(); q.focus(); });
    });
    syncNav(null);
    window.scrollTo(0, 0);
  }

  function renderPage(id, anchor) {
    var p = PAGES[id];
    current = id;
    document.title = p.t + ' · Odoo 12 Docs Reader';
    var crumbs = ancestors(id);
    var words = p.h.replace(/<[^>]+>/g, ' ').split(/\s+/).length;
    var mins = Math.max(1, Math.round(words / 220));
    var pos = order.indexOf(id);
    var prev = pos > 0 ? order[pos - 1] : null;
    var next = pos >= 0 && pos < order.length - 1 ? order[pos + 1] : null;
    view.innerHTML = '<div class="page"><div class="page-main">' +
      '<nav class="crumbs" aria-label="Breadcrumb"><a href="#">Home</a>' + crumbs.map(function (c) {
        return '<span aria-hidden="true">/</span><a href="#' + esc(c) + '">' + esc(title(c)) + '</a>';
      }).join('') + '</nav>' +
      '<div class="page-meta"><span>' + mins + ' min read</span><a href="' + esc(BLOB + p.s) + '" target="_blank" rel="noopener noreferrer">' + esc(p.s) + ' ↗</a></div>' +
      '<details class="toc-inline" hidden><summary>On this page</summary><ol class="toc-list"></ol></details>' +
      '<div class="hitbar" hidden></div>' +
      '<article class="doc" id="app-doc">' + p.h + '</article>' +
      '<nav class="pager" aria-label="Previous and next pages">' +
      (prev ? '<a class="prev" href="#' + esc(prev) + '"><small>Previous</small><span>' + esc(title(prev)) + '</span></a>' : '') +
      (next ? '<a class="next" href="#' + esc(next) + '"><small>Next</small><span>' + esc(title(next)) + '</span></a>' : '') +
      '</nav></div>' +
      '<aside class="toc-rail" hidden><p class="toc-label">On this page</p><ol class="toc-list"></ol></aside></div>';

    var doc = $('#app-doc');
    buildToc(id, doc);
    loadImages(id, doc);
    syncNav(id);
    pushRecent(id);

    var hl = pendingTerms;
    pendingTerms = null;
    var hits = hl ? highlight(doc, hl) : 0;
    if (hits) showHitbar(hl, hits);
    if (anchor) scrollToAnchor(anchor);
    else if (hits) focusHit(0);
    else window.scrollTo(0, 0);
  }

  function scrollToAnchor(anchor) {
    var doc = $('#app-doc');
    var target = doc && doc.querySelector('#' + CSS.escape(anchor));
    if (target) target.scrollIntoView({ block: 'start' });
    else window.scrollTo(0, 0);
  }

  /* ---------- on this page ---------- */
  var tocLinks = [], tocTargets = [];
  function buildToc(id, doc) {
    var heads = $$('section[id] > h2, section[id] > h3', doc);
    tocLinks = []; tocTargets = [];
    if (heads.length < 2) return;
    var items = heads.map(function (h) {
      var sec = h.parentElement;
      return '<li class="lvl-' + h.tagName[1] + '"><a href="#' + esc(id) + '~' + esc(sec.id) + '" data-sec="' + esc(sec.id) + '">' + esc(h.textContent) + '</a></li>';
    }).join('');
    $$('.toc-rail, .toc-inline', view).forEach(function (box) {
      $('.toc-list', box).innerHTML = items;
      box.hidden = false;
    });
    tocTargets = heads;
    tocLinks = $$('.toc-rail .toc-list a', view);
    $$('.toc-inline a', view).forEach(function (a) {
      a.addEventListener('click', function () { a.closest('details').open = false; });
    });
    updateToc();
  }
  var tocTick = false;
  function updateToc() {
    tocTick = false;
    if (!tocTargets.length) return;
    var line = 100, active = 0;
    tocTargets.forEach(function (h, i) { if (h.getBoundingClientRect().top < line) active = i; });
    tocLinks.forEach(function (a, i) { a.classList.toggle('is-active', i === active); });
  }
  window.addEventListener('scroll', function () {
    if (!tocTick) { tocTick = true; requestAnimationFrame(updateToc); }
  }, { passive: true });

  /* ---------- in-page highlight ---------- */
  var hitMarks = [], hitPos = 0;
  function highlight(doc, ts) {
    var usable = ts.filter(function (t) { return t.length > 1; });
    hitMarks = []; hitPos = 0;
    if (!usable.length) return 0;
    var re = new RegExp(usable.map(escRe).sort(function (a, b) { return b.length - a.length; }).join('|'), 'gi');
    var walker = document.createTreeWalker(doc, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) { return n.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP; }
    });
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function (n) {
      if (hitMarks.length >= 500) return;
      var v = n.nodeValue;
      re.lastIndex = 0;
      if (!re.test(v)) return;
      re.lastIndex = 0;
      var frag = document.createDocumentFragment(), last = 0, m;
      while ((m = re.exec(v))) {
        frag.appendChild(document.createTextNode(v.slice(last, m.index)));
        var mk = document.createElement('mark');
        mk.className = 'hit';
        mk.textContent = m[0];
        frag.appendChild(mk);
        hitMarks.push(mk);
        last = m.index + m[0].length;
      }
      frag.appendChild(document.createTextNode(v.slice(last)));
      n.parentNode.replaceChild(frag, n);
    });
    return hitMarks.length;
  }
  function showHitbar(ts, count) {
    var bar = $('.hitbar', view);
    bar.innerHTML = '<span class="hitbar-text"><b>' + count + '</b> ' + (count === 1 ? 'match' : 'matches') + ' for “' + esc(ts.join(' ')) + '”</span>' +
      '<button type="button" data-hit="-1" aria-label="Previous match">↑ Prev</button>' +
      '<button type="button" data-hit="1" aria-label="Next match">↓ Next</button>' +
      '<button type="button" data-hit="clear">Clear</button>';
    bar.hidden = false;
    bar.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      var act = b.getAttribute('data-hit');
      if (act === 'clear') { clearHits(); return; }
      focusHit(hitPos + Number(act));
    });
  }
  function focusHit(i) {
    if (!hitMarks.length) return;
    if (hitMarks[hitPos]) hitMarks[hitPos].classList.remove('is-current');
    hitPos = (i + hitMarks.length) % hitMarks.length;
    var mk = hitMarks[hitPos];
    mk.classList.add('is-current');
    var d = mk.closest('details');
    if (d) d.open = true;
    mk.scrollIntoView({ block: 'center' });
  }
  function clearHits() {
    hitMarks.forEach(function (mk) {
      var parentNode = mk.parentNode;
      parentNode.replaceChild(document.createTextNode(mk.textContent), mk);
      parentNode.normalize();
    });
    hitMarks = [];
    var bar = $('.hitbar', view);
    if (bar) bar.hidden = true;
  }

  /* ---------- screenshots ---------- */
  var bundles = {};
  function loadImages(id, doc) {
    var imgs = $$('img[data-img]', doc);
    if (!imgs.length) return;
    imgs.forEach(function (img) {
      var w = img.getAttribute('width'), h = img.getAttribute('height');
      if (/^\d+$/.test(w) && /^\d+$/.test(h)) img.style.aspectRatio = w + ' / ' + h;
      img.classList.add('is-loading');
    });
    if (!bundles[id]) {
      bundles[id] = fetch('img/' + id + '.json').then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      });
    }
    bundles[id].then(function (b) {
      if (current !== id) return;
      imgs.forEach(function (img) {
        var src = b[img.getAttribute('data-img')];
        if (!src) { img.classList.remove('is-loading'); img.classList.add('is-missing'); return; }
        img.addEventListener('load', function () { img.classList.remove('is-loading'); }, { once: true });
        img.src = src;
      });
    }).catch(function () {
      delete bundles[id];
      imgs.forEach(function (img) { img.classList.remove('is-loading'); img.classList.add('is-missing'); });
    });
  }

  view.addEventListener('click', function (e) {
    var img = e.target.closest('.doc img[src]');
    if (!img || img.naturalWidth < 160 || img.closest('p')) return;
    e.preventDefault();
    $('img', lightbox).src = img.src;
    $('img', lightbox).alt = img.alt;
    lightbox.hidden = false;
  });
  lightbox.addEventListener('click', function () { lightbox.hidden = true; });

  /* ---------- routing ---------- */
  function parseHash() {
    var h = location.hash.slice(1);
    try { h = decodeURIComponent(h); } catch (e) { /* keep raw */ }
    var i = h.indexOf('~');
    return i >= 0 ? { id: h.slice(0, i), anchor: h.slice(i + 1) } : { id: h, anchor: '' };
  }
  function route() {
    var r = parseHash();
    closeDrawer();
    if (!r.id || r.id === 'index' || !PAGES[r.id]) { renderHome(); return; }
    if (r.id === current && !pendingTerms) {
      if (r.anchor) scrollToAnchor(r.anchor); else window.scrollTo(0, 0);
      return;
    }
    renderPage(r.id, r.anchor);
  }
  window.addEventListener('hashchange', route);

  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
      e.preventDefault();
      q.focus();
      q.select();
    } else if (e.key === 'Escape') {
      if (!lightbox.hidden) lightbox.hidden = true;
      else closeDrawer();
    }
  });

  route();
})();
</script>
